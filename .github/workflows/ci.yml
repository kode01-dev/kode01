name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  production-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=moderate

      - name: High severity dependency audit
        run: pnpm audit --audit-level=high

      - name: Secret scan
        run: pnpm run scan:secrets

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Migration date policy
        run: pnpm run check:migrations
        env:
          MIGRATION_DATE_ENFORCE: "false"
