name: Perf Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Start app
        run: pnpm run start -- --port 3100 > /tmp/perf-start.log 2>&1 &

      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3100 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "App did not start in time"
          exit 1

      - name: Run load test
        env:
          PERF_BASE_URL: http://127.0.0.1:3100
          PERF_REQUESTS: '6'
          PERF_CONCURRENCY: '1'
        run: pnpm run perf:load

      - name: Enforce SLO gate
        run: pnpm run perf:gate

      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: tmp/perf-report.json
